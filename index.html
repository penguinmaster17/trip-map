/* A directory reader hands back entries in batches and signals the end with an
   empty batch, so it has to be drained in a loop. Two rules make the difference
   between this working and hanging forever:

   1. Drain one reader completely before recursing into any child directory.
      Interleaving other async work between readEntries calls on the same reader
      makes Chrome stop calling back.
   2. Never let a callback-based API reject into the void. A single unreadable
      file — a cloud placeholder Dropbox hasn't materialised, something locked by
      another process — used to reject and strand the whole import at "Reading
      folder…", which is exactly the hang you hit. Every call below resolves to a
      harmless value on error and is capped by a timeout.

   Filtering to image extensions here, before opening anything, also means we
   never touch .DS_Store, sidecars, or the rest of the folder's clutter. */

const CALLBACK_TIMEOUT = 15000;

/* A phone is not a laptop. Eight files open at once is fine on a desktop and
   is a good way to exhaust a mobile browser's memory allowance — at which point
   iOS kills the tab and the import silently disappears, which looks exactly like
   "I pressed the checkmark and nothing happened". */
const READ_CONCURRENCY = (() => {
  const mem = navigator.deviceMemory || 4;              // GB, where reported
  const cores = navigator.hardwareConcurrency || 4;
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch || mem <= 4) return 3;
  return Math.min(8, Math.max(4, cores));
})();

function once(fn, fallback) {
  return new Promise(resolve => {
    let settled = false, timer = null;
    const finish = v => {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);   // otherwise every file leaves a live
      resolve(v);                       // 15s timer behind — 10k of them at once
    };
    try { fn(finish, () => finish(fallback)); } catch (_) { finish(fallback); }
    if (!settled) timer = setTimeout(() => finish(fallback), CALLBACK_TIMEOUT);
  });
}

async function collectEntries(entry, out, h2) {
  if (entry.isFile) {
    // Judged on the name alone. A 4 GB .MOV sitting next to the photos is
    // rejected here and never opened, so it costs one regex test, not a read.
    if (IMAGE_RE.test(entry.name) && !entry.name.startsWith('.')) out.push(entry);
    else skipped++;
    return;
  }
  if (!entry.isDirectory) return;

  const reader = entry.createReader();
  const children = [];
  while (true) {
    const batch = await once(cb => reader.readEntries(cb), []);
    if (!batch.length) break;
    children.push(...batch);
  }
  for (const child of children) {
    await collectEntries(child, out, h2);
    if (h2 && out.length && out.length % 25 === 0) {
      h2.textContent = `Found ${out.length} photos…`;
    }
  }
}

async function resolveFiles(entries) {
  const files = [];
  let next = 0;
  await Promise.all(Array.from({ length: READ_CONCURRENCY }, async () => {
    while (next < entries.length) {
      const f = await once(cb => entries[next++].file(cb), null);
      if (f) files.push(f);
    }
  }));
  return files;
}

/* ---------- parse ---------- */

// GPSLatitudeRef / GPSLongitudeRef carry the hemisphere (N/S, E/W). Without them
// exifr cannot sign the coordinate, so a western-hemisphere photo comes back as
// +122 instead of -122 and lands on the wrong side of the planet. Always pick them.
const PICK = ['DateTimeOriginal','CreateDate','ModifyDate',
              'GPSLatitude','GPSLongitude','GPSLatitudeRef','GPSLongitudeRef',
              // Phones almost never rotate the pixels. They store the sensor
              // frame as captured, landscape, and record how far to turn it in
              // the Orientation tag. Ignore that tag and every portrait photo
              // comes out on its side. The stored dimensions come along too, so
              // we can tell whether the browser already applied the rotation.
              'Orientation','ImageWidth','ImageHeight',
              'ExifImageWidth','ExifImageHeight'];

const PARSE_OPTS = { tiff: true, exif: true, gps: true, reviveValues: true, pick: PICK };

/* exifr 7.1.3 refuses to open some HEICs: its format check bails when the file's
   `ftyp` box is longer than 50 bytes, and recent iPhones write a 52-byte one
   (major brand `heic`, nine compatible brands). The EXIF inside is perfectly
   normal, so when the front door is locked we find the TIFF block ourselves and
   hand exifr just that slice, which it parses happily.

   The marker is `Exif\0\0` followed immediately by a TIFF header. Checking for
   that header matters: the literal string "Exif" also appears earlier in the
   file as an item-type declaration inside the `iinf` box, and slicing there
   yields garbage. */
function findTiffOffset(u8) {
  for (let i = 0, n = u8.length - 14; i < n; i++) {
    if (u8[i] !== 0x45 || u8[i+1] !== 0x78 || u8[i+2] !== 0x69 ||
        u8[i+3] !== 0x66 || u8[i+4] !== 0x00 || u8[i+5] !== 0x00) continue;
    const a = u8[i+6], b = u8[i+7], c = u8[i+8], d = u8[i+9];
    const bigEndian    = a === 0x4D && b === 0x4D && c === 0x00 && d === 0x2A;
    const littleEndian = a === 0x49 && b === 0x49 && c === 0x2A && d === 0x00;
    if (bigEndian || littleEndian) return i + 6;
  }
  return -1;
}

/* Reading the whole file to find the EXIF block is the expensive way to do this.
   The block sits about 96 KB into a typical iPhone HEIC, so pulling the entire
   3.8 MB is roughly 7x the I/O needed — across ten thousand photos that is ~37 GB
   read instead of ~2.4 GB, which is what makes a large import crawl once the
   operating system's file cache stops absorbing it.

   So: confirm the file really is an ISO base-media container first (12 bytes),
   then read growing prefixes and stop at the first one containing the marker.
   Only a file that hides its EXIF unusually deep costs a full read. */

const HEIC_PREFIXES = [256 * 1024, 1024 * 1024];

const stats = { fast: 0, fallback: 0, failed: 0, bytes: 0, fastMs: 0, fallbackMs: 0,
                thumbs: 0, thumbBytes: 0 };

async function looksLikeHeif(file) {
  if (file.size < 16) return false;
  const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  stats.bytes += 12;
  // 'ftyp' at bytes 4–8 marks HEIC / HEIF / AVIF and friends.
  return head[4] === 0x66 && head[5] === 0x74 && head[6] === 0x79 && head[7] === 0x70;
}

async function parseStubbornHeic(file) {
  if (!(await looksLikeHeif(file))) return null;

  const sizes = HEIC_PREFIXES.filter(s => s < file.size);
  sizes.push(file.size);

  for (const size of sizes) {
    const buf = await file.slice(0, size).arrayBuffer();
    stats.bytes += buf.byteLength;
    const off = findTiffOffset(new Uint8Array(buf));
    if (off >= 0) {
      // The sliced TIFF block is handed back as well — if this file does keep a
      // preview in EXIF, that's where it lives, and re-reading the file to find
      // it again would be wasteful.
      const tiff = buf.slice(off);
      return { parsed: await exifr.parse(tiff, PARSE_OPTS), tiff };
    }
  }
  return null;
}

/* Cameras without a GPS receiver — your Canon EOS 650D among them — don't omit
   the GPS tags, they write them as zeros. exifr reports that honestly as
   latitude 0, longitude 0, which is a real point in the Gulf of Guinea, so a
   naive null check sails those photos off the coast of Africa. Exact 0/0 is
   never a genuine holiday snap; treat it, and anything out of range or NaN, as
   no fix at all. */
function hasFix(p) {
  return Number.isFinite(p.lat) && Number.isFinite(p.lon) &&
         !(p.lat === 0 && p.lon === 0) &&
         Math.abs(p.lat) <= 90 && Math.abs(p.lon) <= 180;
}

/* ---------- thumbnails ----------
   Two routes, cheapest first.

   Most JPEGs carry a small preview inside their EXIF already, so lifting it out
   costs a few kilobytes and no image decoding whatsoever. HEIC doesn't work that
   way — it keeps previews as separate items in the container, which exifr won't
   hand back — so those need a real decode via createImageBitmap. That decodes
   HEIC natively on iOS and Safari but throws on desktop Chrome, which is fine:
   a photo simply ends up without a thumbnail rather than breaking the import. */

/* 200px was enough for a 34px row and useless full-screen — an image that small
   either renders postage-stamp sized or gets upscaled into mush. 900px on the
   long edge looks right filling a phone screen and still costs well under
   100 KB, and the sidebar rows just scale it down. */
const THUMB_PX = 900;
const THUMB_QUALITY = 0.74;
const EMBEDDED_MIN_PX = 400;   // below this, an EXIF preview isn't worth keeping

let canDecodeHeic = null;  // null = untested, then true/false. Tested once.

/* EXIF orientation, 1 to 8. Values 5 to 8 involve a quarter turn, which means
   the finished image has its width and height swapped relative to the stored
   pixels. The transform matrices below are the standard set; each one maps the
   drawn image into a canvas already sized for the rotated result. */
const SWAPS_AXES = o => o >= 5 && o <= 8;

async function shrinkToBlob(source, orientation = 1) {
  const sw = source.width, sh = source.height;
  if (!sw || !sh) return null;

  const swap = SWAPS_AXES(orientation);
  const outW = swap ? sh : sw;
  const outH = swap ? sw : sh;

  const scale = Math.min(1, THUMB_PX / Math.max(outW, outH));
  const dw = Math.max(1, Math.round(sw * scale));   // drawn size, before rotating
  const dh = Math.max(1, Math.round(sh * scale));
  const cw = swap ? dh : dw;                        // canvas size, after rotating
  const ch = swap ? dw : dh;

  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');

  switch (orientation) {
    case 2: ctx.transform(-1, 0, 0,  1, dw,  0); break;   // flip horizontal
    case 3: ctx.transform(-1, 0, 0, -1, dw, dh); break;   // 180
    case 4: ctx.transform( 1, 0, 0, -1,  0, dh); break;   // flip vertical
    case 5: ctx.transform( 0, 1, 1,  0,  0,  0); break;   // transpose
    case 6: ctx.transform( 0, 1, -1, 0, dh,  0); break;   // 90 clockwise
    case 7: ctx.transform( 0, -1, -1, 0, dh, dw); break;  // transverse
    case 8: ctx.transform( 0, -1, 1, 0,  0, dw); break;   // 270 clockwise
    default: break;                                        // 1, or absent
  }
  ctx.drawImage(source, 0, 0, dw, dh);

  return new Promise(resolve =>
    canvas.toBlob(resolve, 'image/jpeg', THUMB_QUALITY));
}

/* Decode first now, embedded EXIF second — the reverse of before.

   An embedded EXIF preview is almost free but iPhones write them at 160x120,
   which is fine for a row in a list and hopeless full-screen. Decoding gives a
   900px image worth looking at. This runs sequentially in the second pass of an
   import, so the memory cost is one image at a time rather than eight. */
async function makeThumb(file, tiffBuffer, exif) {
  const isHeic = /hei[cf]$/i.test(file.name);
  const orientation = Number(exif && exif.orientation) || 1;
  const storedW = exif && exif.storedW;
  const storedH = exif && exif.storedH;

  if (!(canDecodeHeic === false && isHeic)) {
    try {
      /* Ask the decoder to apply the orientation itself. Browsers disagree about
         whether that is the default, so rather than trust either answer we check
         the result: if the rotation happened, a quarter-turned photo comes back
         with its stored width and height swapped. Only rotate by hand when the
         decoder clearly didn't, otherwise the image gets turned twice. */
      const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });

      let applyOrientation = orientation;
      if (SWAPS_AXES(orientation) && storedW && storedH) {
        const alreadyRotated = bitmap.width === storedH && bitmap.height === storedW;
        if (alreadyRotated) applyOrientation = 1;
      }

      const blob = await shrinkToBlob(bitmap, applyOrientation);
      bitmap.close();
      if (isHeic) canDecodeHeic = true;
      if (blob) return blob;
    } catch (_) {
      // Remember the failure so 10,000 HEICs don't each retry a decode this
      // browser was never going to manage — desktop Chrome, mainly.
      if (isHeic) canDecodeHeic = false;
    }
  }

  // Fall back to whatever the file carries, if it's big enough to be worth it.
  try {
    const embedded = await exifr.thumbnail(tiffBuffer || file);
    if (embedded && embedded.byteLength > 2048) {
      const blob = new Blob([embedded], { type: 'image/jpeg' });
      try {
        // An embedded preview is bare JPEG with no EXIF of its own, so the
        // parent's orientation always has to be applied here by hand.
        const bmp = await createImageBitmap(blob);
        const out = await shrinkToBlob(bmp, orientation);
        bmp.close();
        return out || blob;
      } catch (_) { return blob; }
    }
  } catch (_) {}

  return null;
}

async function readExif(file, wantThumb) {
  let lat = null, lon = null, when = null, x = null, tiff = null;

  const t0 = performance.now();
  try {
    x = await exifr.parse(file, PARSE_OPTS);
  } catch (_) { /* format not recognized — the HEIC fallback below may still work */ }

  if (!x || (x.latitude == null && !x.DateTimeOriginal)) {
    try {
      const rescued = await parseStubbornHeic(file);
      if (rescued) { x = rescued.parsed; tiff = rescued.tiff; }
      stats.fallback++;
      stats.fallbackMs += performance.now() - t0;
    } catch (_) { stats.failed++; }
  } else {
    stats.fast++;
    stats.fastMs += performance.now() - t0;
  }

  if (x) {
    lat  = x.latitude ?? null;
    lon  = x.longitude ?? null;
    when = x.DateTimeOriginal || x.CreateDate || x.ModifyDate || null;
  }

  // Carried through so the thumbnail pass can rotate correctly without
  // re-reading the file.
  const shape = {
    orientation: x ? Number(x.Orientation) || 1 : 1,
    storedW: x ? (x.ExifImageWidth || x.ImageWidth || 0) : 0,
    storedH: x ? (x.ExifImageHeight || x.ImageHeight || 0) : 0
  };

  let thumb = null;
  if (wantThumb) {
    thumb = await makeThumb(file, tiff, shape);
    if (thumb) { stats.thumbs++; stats.thumbBytes += thumb.size; }
  }

  // Fall back to file mtime so a photo without EXIF time still orders sensibly.
  if (!when && file.lastModified) when = new Date(file.lastModified);
  return { name: file.name, size: file.size, lat, lon, when, thumb, shape };
}

async function ingest(all) {
  // The drag-and-drop path already filtered by name; this catches the picker,
  // which hands over the whole folder listing including videos and documents.
  // Filename alone isn't enough on iOS — the photo picker can hand back a file
  // whose name carries no useful extension, so the MIME type gets a vote too.
  const files = all.filter(f =>
    !f.name.startsWith('.') &&
    (IMAGE_RE.test(f.name) || /^image\//i.test(f.type || '')));
  skipped += all.length - files.length;

  if (!files.length) {
    drop.querySelector('h2').textContent = all.length
      ? `Nothing readable in those ${all.length} file${all.length === 1 ? '' : 's'}`
      : 'Nothing came back from the picker — try "Choose photos"';
    return;
  }

  const out = [];
  let next = 0, done = 0;
  const h2 = drop.querySelector('h2');
  Object.keys(stats).forEach(k => stats[k] = 0);
  const tStart = performance.now();

  /* Two passes, on purpose.

     Reading metadata is cheap and near-certain to succeed. Building a thumbnail
     from a HEIC means decoding a full 12-megapixel image, and doing several of
     those at once on a phone is how a tab runs out of memory and dies — taking
     the whole unsaved import with it.

     So: pass one reads metadata for everything and commits it to the database
     straight away. Pass two adds thumbnails on top, one at a time. If the tab is
     killed partway through pass two, the photos are already on the map and
     re-importing later fills in the previews. */

  h2.textContent = `Reading ${files.length} photos…`;

  /* Committed in chunks rather than all at the end. If the tab is killed while
     reading 400 photos, everything already written survives — previously the
     whole batch was lost because nothing was saved until the last one finished. */
  const CHUNK = 25;
  for (let start = 0; start < files.length; start += CHUNK) {
    const slice = files.slice(start, start + CHUNK);
    const part = [];
    let k = 0;

    await Promise.all(Array.from({ length: READ_CONCURRENCY }, async () => {
      while (k < slice.length) {
        const f = slice[k++];
        part.push({ file: f, meta: await readExif(f, false) });
        if (++done % 5 === 0 || done === files.length) {
          h2.textContent = `Reading ${done} / ${files.length}…`;
          crumb('reading', { done, count: files.length });
        }
      }
    }));

    const merged = await mergeIntoLibrary(part.map(o => toRecord(o.meta)));
    lastImport = lastImport && start
      ? { added: lastImport.added + merged.added,
          known: lastImport.known + merged.known,
          total: merged.total }
      : merged;

    out.push(...part);
    await new Promise(r => setTimeout(r, 0));   // let the browser breathe
  }
  clearCrumb();

  intro.classList.add('hidden');
  await rebuildFromLibrary();          // photos are on the map from here on

  // ---- pass two: thumbnails, sequential, best effort ----
  await buildThumbsInBackground(out);

  // Open the console after a slow import — this says where the time actually went.
  console.log(
    `%cimport: ${files.length} photos in ${((performance.now() - tStart)/1000).toFixed(1)}s`,
    'font-weight:bold',
    {
      'fast path':      `${stats.fast} photos, ${(stats.fastMs/(stats.fast||1)).toFixed(1)} ms each`,
      'HEIC fallback':  `${stats.fallback} photos, ${(stats.fallbackMs/(stats.fallback||1)).toFixed(1)} ms each`,
      'unreadable':     stats.failed,
      'bytes read':     `${(stats.bytes/1048576).toFixed(0)} MB`,
      'thumbnails':     `${stats.thumbs} made, ${(stats.thumbBytes/1048576).toFixed(1)} MB stored`
    });

  h2.textContent = 'Drag a folder of photos here';
}

/* Thumbnails, after the metadata is already safely stored.

   Strictly one at a time: each HEIC decode inflates to a full-resolution bitmap
   in memory, and running a batch of those in parallel is what kills the tab on a
   phone. A pause every few photos hands the main thread back so the map stays
   responsive and the garbage collector gets a chance to run. */

async function buildThumbsInBackground(items) {
  const pending = items.filter(o => o.meta && !o.meta.thumb);
  if (!pending.length) return;

  for (let i = 0; i < pending.length; i++) {
    const o = pending[i];
    try {
      const thumb = await makeThumb(o.file, null, o.meta.shape);
      if (thumb) {
        stats.thumbs++;
        stats.thumbBytes += thumb.size;
        await saveThumb(toRecord(o.meta).id, thumb);
      }
    } catch (_) { /* one bad photo shouldn't stop the rest */ }

    if (i % 4 === 3) {
      statsEl.textContent = `Making previews… ${i + 1} of ${pending.length}`;
      await new Promise(r => setTimeout(r, 0));   // yield to the browser
    }
  }
  await rebuildFromLibrary();
}

async function saveThumb(id, thumb) {
  if (!libraryAvailable) return;
  try {
    const db = await openDb();
    const store = db.transaction(STORE, 'readwrite').objectStore(STORE);
    const rec = await idbRequest(store.get(id));
    if (rec) { rec.thumb = thumb; store.put(rec); }
    db.close();
  } catch (_) { libraryAvailable = false; }
}

/* ---------- the library ----------
   Photos accumulate in IndexedDB and survive reloads, so importing a second
   folder adds to the map rather than replacing it. Nothing is uploaded — this
   is a database inside the browser, on this machine.

   The identity of a photo is its filename, byte size and capture time. Photos
   are immutable, so that triple is stable: re-importing a folder you have
   already added is recognized and skipped rather than duplicated. */

const DB_NAME = 'trip-map', DB_VERSION = 1, STORE = 'photos';

let lastImport = null;
let libraryAvailable = true;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbRequest(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Dates don't survive a JSON round trip, so time is stored as epoch milliseconds
// and revived on the way out. Coordinates are normalized here too, which means
// a camera's zeroed GPS tags never reach the database in the first place.
function toRecord(p) {
  const whenMs = p.when ? +p.when : null;
  const located = hasFix(p);
  return {
    id: `${p.name}|${p.size}|${whenMs ?? 0}`,
    name: p.name,
    size: p.size,
    lat: located ? p.lat : null,
    lon: located ? p.lon : null,
    when: whenMs,
    // IndexedDB stores Blobs directly, so the thumbnail rides along with the
    // record. It is deliberately left out of JSON export — see below.
    thumb: p.thumb || null,
    addedAt: Date.now()
  };
}

async function mergeIntoLibrary(records) {
  // Collapse duplicates inside this batch first — the same photo can appear
  // twice if a folder contains a copy of itself.
  const batch = new Map();
  for (const r of records) if (r.id) batch.set(r.id, r);

  if (!libraryAvailable) return { added: batch.size, known: 0, total: batch.size };

  try {
    const db = await openDb();
    const known = new Set(await idbRequest(db.transaction(STORE).objectStore(STORE).getAllKeys()));

    let added = 0, seen = 0;
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      const store = tx.objectStore(STORE);
      for (const [id, rec] of batch) {
        if (known.has(id)) {
          seen++;
          // Already have it — but if this pass produced a thumbnail and the
          // stored copy predates thumbnails, take the upgrade. That way
          // re-importing an old folder fills in previews rather than doing
          // nothing at all.
          if (rec.thumb) store.put(rec);
          continue;
        }
        store.put(rec);
        added++;
      }
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });

    const total = await idbRequest(db.transaction(STORE).objectStore(STORE).count());
    db.close();
    return { added, known: seen, total };
  } catch (err) {
    console.warn('library unavailable, staying in memory for this session:', err);
    libraryAvailable = false;
    return { added: batch.size, known: 0, total: batch.size };
  }
}

async function loadLibrary() {
  if (!libraryAvailable) return [];
  try {
    const db = await openDb();
    const recs = await idbRequest(db.transaction(STORE).objectStore(STORE).getAll());
    db.close();
    return recs.map(r => ({ ...r, when: r.when ? new Date(r.when) : null }));
  } catch (err) {
    console.warn('could not read library:', err);
    libraryAvailable = false;
    return [];
  }
}

async function clearLibrary() {
  const db = await openDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

async function rebuildFromLibrary() {
  const recs = await loadLibrary();
  photos   = recs.filter(r => hasFix(r) && r.when).sort((a, b) => a.when - b.when);
  unplaced = recs.filter(r => !hasFix(r) || !r.when);
  trips    = clusterTrips(photos);
  resetBt.hidden = false;
  build();
}

/* ---------- clustering ----------
   Walk photos in time order. Start a new trip when the gap to the previous
   photo exceeds GAP_HOURS, or when the distance exceeds JUMP_KM (a flight
   between two same-day photos should still split).                        */

function clusterTrips(list) {
  const out = [];
  let cur = null;
  for (const p of list) {
    if (cur) {
      const prev  = cur.photos[cur.photos.length - 1];
      const hours = (p.when - prev.when) / 36e5;
      const km    = haversineKm(prev.lat, prev.lon, p.lat, p.lon);
      if (hours > GAP_HOURS || km > JUMP_KM) cur = null;
    }
    if (!cur) { cur = { photos: [] }; out.push(cur); }
    cur.photos.push(p);
  }

  // Newest trip first — the one you just got back from is the one you want.
  out.reverse();

  out.forEach((t, i) => {
    const ps = t.photos;
    t.color = PALETTE[i % PALETTE.length];
    t.start = ps[0].when;
    t.end   = ps[ps.length - 1].when;
    t.place = nearestCity(ps[0].lat, ps[0].lon);
    const endPlace = nearestCity(ps[ps.length - 1].lat, ps[ps.length - 1].lon);
    if (endPlace !== t.place) t.place += ' → ' + endPlace;

    // group into days
    const byDay = new Map();
    for (const p of ps) {
      const k = dayKey(p.when);
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(p);
    }
    t.days = [...byDay.entries()].map(([k, v]) => ({ key: k, photos: v }));

    // total distance walked
    let km = 0;
    for (let j = 1; j < ps.length; j++)
      km += haversineKm(ps[j-1].lat, ps[j-1].lon, ps[j].lat, ps[j].lon);
    t.km = km;
  });

  return out;
}

/* ---------- render ---------- */

const IS_TOUCH = matchMedia('(pointer: coarse)').matches;

const darkScheme = matchMedia('(prefers-color-scheme: dark)');
const basemapUrl = () =>
  `https://{s}.basemaps.cartocdn.com/${darkScheme.matches ? 'dark_all' : 'light_all'}/{z}/{x}/{y}{r}.png`;

let tiles = null;

// Follow the system theme while the app is open, not just at load.
darkScheme.addEventListener('change', () => {
  if (tiles) tiles.setUrl(basemapUrl());
});

/* The blank bands above and below the map at full zoom-out are a consequence of
   Web Mercator: the projection stops at about 85 degrees, so the world is a
   square, and a square can't fill a portrait screen. Zooming out far enough
   makes the map narrower than the window and the leftover is empty canvas.

   The world is 256 * 2^zoom pixels tall, so the smallest zoom that still covers
   the container is log2(height / 256). Clamping there means you can never reach
   the level where the gaps appear. */
function clampMinZoom() {
  const h = map.getSize().y;
  // Whole numbers, to match zoomSnap — a fractional floor would just get
  // rounded anyway and makes the limit harder to reason about.
  map.setMinZoom(Math.max(0, Math.ceil(Math.log2(Math.max(1, h) / 256))));
}

function build() {
  if (!map) {
    map = L.map('map', {
      zoomControl: true,
      worldCopyJump: true,
      zoomAnimation: true,
      // Whole-number zoom steps. Fractional levels force the browser to scale
      // every tile, which is what makes a pinch feel soft and arrive blurry.
      zoomSnap: 1,
      wheelPxPerZoomLevel: 120,
      // Stop the map being dragged off the top or bottom of the world into
      // empty gray. Longitude stays free so it still wraps around.
      maxBounds: L.latLngBounds([-85, -Infinity], [85, Infinity]),
      maxBoundsViscosity: 1.0
    });

    /* Positron and Dark Matter, rather than Voyager. Voyager renders roads,
       parks and landuse in strong color, which competes with the route lines —
       the trip should be the loudest thing on the map, not the basemap. These
       are near-monochrome, so a colored route reads instantly. */
    tiles = L.tileLayer(basemapUrl(), {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19,
      // Don't fetch tiles for every intermediate frame of a zoom — request them
      // once the gesture settles. This is most of the "takes a second" feeling.
      updateWhenZooming: false,
      updateWhenIdle: IS_TOUCH,
      // Hold a wider ring of tiles around the viewport so a small pan or a zoom
      // back out reuses what's already there instead of going to the network.
      keepBuffer: 4,
      crossOrigin: true
    });
    tiles.addTo(map);

    clampMinZoom();
    // Rotating the phone changes the container; Leaflet needs telling, and the
    // minimum zoom has to be recomputed for the new height.
    let resizeTimer;
    addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { map.invalidateSize(); clampMinZoom(); }, 150);
    });
  }
  layers.forEach(l => map.removeLayer(l));
  layers = [];
  markerIndex.clear();
  if (cluster) { map.removeLayer(cluster); cluster = null; }

  /* Previously every photo was its own marker on the map, so Leaflet held a DOM
     node per photo and repositioned all of them on every zoom frame. The cluster
     group keeps markers out of the document until they're actually on screen,
     which is what makes a large library scroll and zoom smoothly. */
  cluster = L.markerClusterGroup({
    chunkedLoading: true,          // add markers in slices instead of one long freeze
    maxClusterRadius: 55,
    disableClusteringAtZoom: 17,   // close in, you get the numbered pins back
    spiderfyOnMaxZoom: true,       // photos on the same spot fan out
    showCoverageOnHover: false,
    iconCreateFunction(c) {
      const n = c.getChildCount();
      const size = n < 10 ? 32 : n < 100 ? 38 : n < 1000 ? 46 : 54;
      return L.divIcon({
        className: '',
        html: `<div class="cluster" style="width:${size}px;height:${size}px;` +
              `line-height:${size - 4}px;font-size:${n < 1000 ? 12 : 11}px">${n}</div>`,
        iconSize: [size, size]
      });
    }
  });

  // Lines go to a canvas renderer — an SVG path with thousands of points is
  // its own source of zoom lag, separate from the markers.
  const lineRenderer = L.canvas({ padding: 0.3 });
  const bounds = L.latLngBounds([]);
  const pending = [];

  trips.forEach(trip => {
    const pts = trip.photos.map(p => [p.lat, p.lon]);
    pts.forEach(pt => bounds.extend(pt));   // extend, don't spread — push(...pts)
                                            // overflows the stack on big libraries
    if (pts.length > 1) {
      const line = L.polyline(pts, {
        color: trip.color, weight: 3, opacity: .75,
        lineJoin: 'round', smoothFactor: 2, renderer: lineRenderer
      }).addTo(map);
      layers.push(line);
    }

    trip.photos.forEach((p, pi) => {
      const m = L.marker([p.lat, p.lon], {
        icon: L.divIcon({
          className: '',
          html: `<div class="marker-dot" style="background:${trip.color}"></div>`,
          iconSize: [11, 11], iconAnchor: [5.5, 5.5]
        })
      });
      // Popups are built on demand; making ten thousand HTML strings up front
      // is wasted work when you'll open a handful.
      m.bindPopup(() => {
        const url = thumbUrl(p);
        const el = document.createElement('div');
        el.innerHTML =
          (url ? `<img src="${url}" class="popup-thumb" alt="">` : '') +
          `<b>${escapeHtml(p.name)}</b>` +
          `<span>${longDay(p.when)} · ${clock(p.when)}<br>` +
          `stop ${pi + 1} of ${trip.photos.length} · ${escapeHtml(trip.place)}<br>` +
          `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span>`;
        const img = el.querySelector('img');
        if (img) img.addEventListener('click', () => openViewer(p));
        return el;
      });
      pending.push(m);
      markerIndex.set(p, m);
    });
  });

  cluster.addLayers(pending);   // one bulk insert beats ten thousand single adds
  map.addLayer(cluster);

  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [45, 45], maxZoom: 14 });
  } else {
    map.setView([20, 0], 2);
  }

  renderSidebar();

  const days  = trips.reduce((n, t) => n + t.days.length, 0);
  const total = photos.length + unplaced.length;
  const has   = total > 0;

  exportBt.hidden = importBt.hidden = clearBt.hidden = !has;
  importBt.hidden = false;   // importing a library is how you start on a new machine

  const num = n => n.toLocaleString();
  const parts = [
    `<b>${num(photos.length)}</b> located`,
    `<b>${num(trips.length)}</b> trip${trips.length === 1 ? '' : 's'}`,
    `<b>${num(days)}</b> day${days === 1 ? '' : 's'}`
  ];
  if (unplaced.length) parts.push(`${num(unplaced.length)} unplaced`);
  if (skipped) parts.push(`${num(skipped)} non-photo file${skipped === 1 ? '' : 's'} skipped`);
  if (lastImport) {
    parts.push(lastImport.added
      ? `just added <b>${num(lastImport.added)}</b>` +
        (lastImport.known ? `, ${num(lastImport.known)} already known` : '')
      : `nothing new — all ${num(lastImport.known)} already in your library`);
  }
  if (!libraryAvailable && has) parts.push('not saved (storage unavailable)');

  statsEl.innerHTML = has ? parts.join(' · ') : '';
  // Same summary, plain text, for the sheet handle on phones where the header
  // is hidden entirely.
  sheetStats.textContent = has ? parts.join(' · ').replace(/<\/?b>/g, '') : '';
}

function renderSidebar() {
  sideBody.innerHTML = '';

  trips.forEach((trip, i) => {
    const el = document.createElement('div');
    el.className = 'trip' + (i === 0 ? ' open' : '');
    el.innerHTML = `
      <div class="trip-head">
        <span class="caret">▶</span>
        <span class="swatch" style="background:${trip.color}"></span>
        <span class="trip-title">${escapeHtml(trip.place)}
          <small>${rangeLabel(trip.start, trip.end)} · ${trip.photos.length} photos${
            trip.km > 1 ? ' · ' + Math.round(trip.km) + ' km' : ''}</small>
        </span>
        ${trip.photos.length > 1 ? '<button class="play-trip">▶ Play</button>' : ''}
      </div>
      <div class="trip-body"></div>`;

    const playBtn = el.querySelector('.play-trip');
    if (playBtn) playBtn.addEventListener('click', e => {
      e.stopPropagation();      // don't also expand/collapse the trip
      startPlayback(trip);
    });

    el.querySelector('.trip-head').addEventListener('click', () => {
      el.classList.toggle('open');
      if (el.classList.contains('open')) zoomTo(trip.photos);
    });
    // Expanding a trip zooms the map to it — keep the sheet up so you can then
    // pick a day, but the map underneath has already moved.

    const body = el.querySelector('.trip-body');
    trip.days.forEach(day => {
      const d = document.createElement('div');
      d.className = 'day';
      d.innerHTML = `<div class="day-head">
          <span>${longDay(day.photos[0].when)}</span><span>${day.photos.length}</span>
        </div>`;
      // Zooming somewhere is a request to look at the map, so the sheet gets
      // out of the way. On desktop the class is inert.
      d.querySelector('.day-head').addEventListener('click', () => {
        zoomTo(day.photos); closeSheet();
      });

      day.photos.forEach(p => {
        const s = document.createElement('div');
        s.className = 'shot';
        s.appendChild(thumbEl(p));
        s.insertAdjacentHTML('beforeend',
          `<span class="t">${clock(p.when)}</span>
           <span class="n">${escapeHtml(p.name)}</span>`);
        s.querySelector('.thumb').addEventListener('click', e => {
          e.stopPropagation();          // tapping the image opens it full screen,
          openViewer(p);                // tapping the row still flies to the pin
        });
        s.addEventListener('click', () => {
          const m = markerIndex.get(p);
          if (!m) return;
          // The marker may be folded inside a cluster; this expands down to it
          // first, otherwise openPopup fires on something not currently drawn.
          closeSheet();
          if (cluster) cluster.zoomToShowLayer(m, () => m.openPopup());
          else { map.setView([p.lat, p.lon], Math.max(map.getZoom(), 15)); m.openPopup(); }
        });
        d.appendChild(s);
      });
      body.appendChild(d);
    });

    sideBody.appendChild(el);
  });

  if (unplaced.length) {
    const el = document.createElement('div');
    el.className = 'trip open';
    el.id = 'unplaced';
    el.innerHTML = `
      <div class="trip-head">
        <span class="swatch" style="background:var(--muted)"></span>
        <span class="trip-title">Unplaced
          <small>${unplaced.length} photo${unplaced.length === 1 ? '' : 's'} with no coordinates${
            // Everything unplaced and nothing on the map is the signature of iOS
            // removing location data on its way out of the photo picker, rather
            // than of photos that genuinely lack it.
            !photos.length && unplaced.length
              ? '<br>Every photo came through without a location. On iPhone that ' +
                'usually means iOS stripped it — check the picker for a Location option.'
              : ''}</small>
        </span>
      </div>
      <div class="trip-body">${
        unplaced.slice().sort((a, b) => (a.when || 0) - (b.when || 0))
          .map(p => `<div class="up-item">${escapeHtml(p.name)}${
            p.when ? ' · ' + dayKey(p.when) : ''}</div>`).join('')
      }</div>`;
    sideBody.appendChild(el);
  }

  if (!trips.length && !unplaced.length) {
    sideBody.innerHTML = '<div class="empty">Nothing to show.</div>';
  }
}

/* ---------- thumbnail display ----------
   Object URLs are created once per photo and cached on the record. Minting one
   per sidebar row up front would mean thousands of live URLs, so images are
   only given a src when they scroll into view. */

function thumbUrl(p) {
  if (!p.thumb) return null;
  if (!p._url) p._url = URL.createObjectURL(p.thumb);
  return p._url;
}

const thumbObserver = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    const img = entry.target;
    const p = img._photo;
    const url = p && thumbUrl(p);
    if (url) img.src = url;
    thumbObserver.unobserve(img);
  }
}, { rootMargin: '200px' });

function thumbEl(p) {
  const img = document.createElement('img');
  img.className = 'thumb' + (p.thumb ? '' : ' empty');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  if (p.thumb) { img._photo = p; thumbObserver.observe(img); }
  return img;
}

/* ---------- full-screen view ----------
   This shows the stored thumbnail, not the original file. A web page can't hold
   onto the photo itself between sessions, and it has no way to open the Photos
   app at a particular image — the file picker only ever hands over a name and
   some bytes, never an identifier worth linking to. The filename is shown
   because that is what you'd search for in Photos. */

const viewer = document.getElementById('viewer');
const viewerBody = document.getElementById('viewerBody');
const viewerMeta = document.getElementById('viewerMeta');

function openViewer(p) {
  const url = thumbUrl(p);
  viewerBody.innerHTML = url
    ? `<img src="${url}" alt="">`
    : `<div class="none">No preview stored for this photo</div>`;
  viewerMeta.innerHTML =
    `<b>${escapeHtml(p.name)}</b>` +
    `<span>${p.when ? longDay(p.when) + ' · ' + clock(p.when) : 'no timestamp'}` +
    (hasFix(p) ? ` · ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}` : ' · no coordinates') +
    `</span>` +
    `<span class="hint">Stored preview — search this filename in Photos for the original.</span>`;
  viewer.classList.add('open');
}

function closeViewer() { viewer.classList.remove('open'); }

document.getElementById('viewerClose').addEventListener('click', closeViewer);
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer();
});

/* ---------- route playback ----------
   Replays a trip: the line draws itself in the order the photos were taken,
   the map follows, and the caption tracks where you were and when.

   Timing is the interesting bit, and the obvious approach is wrong. Pacing each
   hop by how long it took hands most of the replay to the gaps: an overnight
   stop and a two-hour lunch are the longest events in any trip, and neither has
   anything to show. Tested on a real Athens day, sleeping took 5.1 of 22
   seconds while a burst of three photos got 0.08.

   What the viewer is actually watching is the line crossing the map, so pace by
   distance instead. The square root keeps a long transfer from swallowing
   everything, and the constant gives every photo a beat of its own so bursts
   still tick past rather than vanishing. Sleeping now costs 1 second and the
   taxi across town costs 6.9. */

const PLAY_TOTAL_MS = 16000;   // time spent travelling, across a whole trip
const SEG_BEAT      = 0.35;    // every hop gets this much weight regardless
const segWeight = km => SEG_BEAT + Math.sqrt(Math.max(0, km));

/* ---------- stops ----------
   Standing in one place taking eight photos of the same thing is not eight
   places visited. Consecutive photos close together in both space and time
   collapse into a single stop, and only one of them gets shown.

   75 m is roughly "same viewpoint" — wide enough to absorb GPS drift between
   shots, narrow enough that walking to the next thing starts a new stop. The
   time limit catches returning to the same spot later in the day: same place,
   different moment, worth showing again. */
const STOP_RADIUS_M = 75;
const STOP_GAP_MIN  = 45;

const DWELL_BUDGET_MS = 17000;  // total time given to photos across the trip
const DWELL_MIN_MS    = 650;
const DWELL_MAX_MS    = 1500;

/* A long trip can easily have hundreds of stops, and pausing at every one turns
   a replay into a five-minute slideshow. Above this many, the route still runs
   through every stop but photos only appear at a selection of them.

   Which ones: the stops where you took the most photos. How long you lingered
   somewhere is the one signal in the data for how much you cared about it. */
const MAX_PHOTO_STOPS = 28;
const PASSTHROUGH_BUDGET_MS = 4000;   // total, across every stop without a photo

/* Which photo represents a stop.

   There is no way to judge composition from metadata, so this uses the one
   signal that genuinely correlates: file size. Within a burst of the same scene
   and format, the larger file is the more detailed one, because a soft or
   motion-blurred frame has less high-frequency information and compresses
   smaller. It is a proxy for sharpness, not for taste.

   Where two frames are within 3% of each other the later one wins, on the
   theory that you kept re-taking until you got the one you wanted. That does
   mean the chosen frame is not always the strictly largest — a 2.35 MB shot
   taken after a 2.40 MB one is treated as a tie and the later wins. */
function pickRepresentative(photos) {
  const withThumb = photos.filter(p => p.thumb);
  const pool = withThumb.length ? withThumb : photos;
  let best = pool[0];
  for (const p of pool) {
    if (p.size > best.size * 1.03) best = p;
    else if (p.size > best.size * 0.97 && p.when > best.when) best = p;
  }
  return best;
}

function buildStops(photos) {
  const stops = [];
  for (const p of photos) {
    const cur = stops[stops.length - 1];
    if (cur) {
      const metres = haversineKm(cur.lat, cur.lon, p.lat, p.lon) * 1000;
      const mins = Math.abs(p.when - cur.lastWhen) / 60000;
      if (metres <= STOP_RADIUS_M && mins <= STOP_GAP_MIN) {
        cur.photos.push(p);
        cur.lastWhen = p.when;
        continue;
      }
    }
    stops.push({ lat: p.lat, lon: p.lon, photos: [p], when: p.when, lastWhen: p.when });
  }
  for (const s of stops) s.rep = pickRepresentative(s.photos);
  return stops;
}

const playbar    = document.getElementById('playbar');
const playPlace  = document.getElementById('playPlace');
const playSub    = document.getElementById('playSub');
const playFill   = document.getElementById('playFill');
const playThumb  = document.getElementById('playThumb');
const playPauseB = document.getElementById('playPause');
const playSpeedB = document.getElementById('playSpeed');

let playback = null;
const SPEEDS = [1, 2, 0.5];

const playPhoto = document.getElementById('playphoto');
const playPhotoImg = playPhoto.querySelector('img');

/* Show the stop's representative photo, or clear it. Called every frame, so it
   tracks what is already on screen and only touches the DOM on a change —
   reassigning src each frame would restart the decode and kill the fade. */
function showPlayPhoto(stop) {
  const url = stop && stop.rep && thumbUrl(stop.rep);
  if (url) {
    if (playback.photoUp !== url) {
      playback.photoUp = url;
      // Hold the previous shape until the new image reports its own, so the
      // card doesn't visibly snap from one ratio to another mid-fade.
      playPhotoImg.src = url;
      if (playPhotoImg.complete) applyPhotoRatio();
    }
    playPhoto.classList.add('on');
  } else {
    if (playback.photoUp !== false) playback.photoUp = false;
    playPhoto.classList.remove('on');
  }
}

function applyPhotoRatio() {
  const w = playPhotoImg.naturalWidth, h = playPhotoImg.naturalHeight;
  if (w && h) playPhoto.style.setProperty('--ar', `${w} / ${h}`);
}

// Fires for images that weren't already decoded and cached.
playPhotoImg.addEventListener('load', applyPhotoRatio);

/* Tap the photo to hold on it. The replay stops where it is rather than jumping
   anywhere, so tapping again carries straight on from the same stop. */
playPhoto.addEventListener('click', e => {
  e.stopPropagation();
  if (!playback) return;
  playback.paused = !playback.paused;
  playPhoto.classList.toggle('held', playback.paused);
  playPauseB.textContent = playback.paused ? 'Play' : 'Pause';
});

/* ---------- smoothing ----------
   Straight lines between stops look mechanical, all hard corners. The app has
   no idea where the roads are and isn't going to invent them, but it can at
   least round the corners.

   This is a centripetal Catmull-Rom spline. Two properties matter here: it
   passes exactly through every stop, so the dot still lands where the photo was
   taken; and the centripetal parameterisation, unlike the uniform version,
   cannot form loops or cusps at sharp turns — which is precisely what a walking
   route doubling back on itself would produce. */

function catmullRom(p0, p1, p2, p3, t, alpha = 0.5) {
  const d = (a, b) => Math.pow(Math.hypot(b[0] - a[0], b[1] - a[1]), alpha);
  const t0 = 0;
  const t1 = t0 + (d(p0, p1) || 1e-6);
  const t2 = t1 + (d(p1, p2) || 1e-6);
  const t3 = t2 + (d(p2, p3) || 1e-6);
  const tt = t1 + (t2 - t1) * t;

  const lerp = (a, b, ta, tb, x) => {
    const w = (x - ta) / (tb - ta || 1e-6);
    return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w];
  };
  const a1 = lerp(p0, p1, t0, t1, tt);
  const a2 = lerp(p1, p2, t1, t2, tt);
  const a3 = lerp(p2, p3, t2, t3, tt);
  const b1 = lerp(a1, a2, t0, t2, tt);
  const b2 = lerp(a2, a3, t1, t3, tt);
  return lerp(b1, b2, t1, t2, tt);
}

/* Returns a dense point list for the whole trip plus, for each stop, the index
   where it sits in that list — so playback can walk the curve and still know
   exactly when it has arrived somewhere. */
function smoothRoute(stops) {
  const raw = stops.map(s => [s.lat, s.lon]);
  if (raw.length < 2) return { pts: raw, stopAt: raw.map((_, i) => i) };

  const pts = [raw[0]];
  const stopAt = [0];

  for (let i = 0; i < raw.length - 1; i++) {
    const p0 = raw[i - 1] || raw[i];
    const p1 = raw[i];
    const p2 = raw[i + 1];
    const p3 = raw[i + 2] || raw[i + 1];

    // More samples over longer hops, so the curve stays smooth at any scale.
    const km = haversineKm(p1[0], p1[1], p2[0], p2[1]);
    const n = Math.max(6, Math.min(48, Math.round(km * 4) + 6));

    for (let k = 1; k <= n; k++) pts.push(catmullRom(p0, p1, p2, p3, k / n));
    stopAt.push(pts.length - 1);
  }
  return { pts, stopAt };
}

// Running distance along the curve, so the dot moves at an even speed rather
// than racing through densely sampled corners.
function cumulativeLengths(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) {
    cum.push(cum[i-1] + haversineKm(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]));
  }
  return cum;
}

function pointAtDistance(pts, cum, target) {
  if (target <= 0) return pts[0];
  const last = cum[cum.length - 1];
  if (target >= last) return pts[pts.length - 1];
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (cum[mid] <= target) lo = mid; else hi = mid;
  }
  const span = cum[hi] - cum[lo] || 1e-9;
  const f = (target - cum[lo]) / span;
  return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f,
          pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f];
}

/* The timeline alternates: pause at a stop while its photo is up, travel to the
   next one, pause again. Travel keeps the distance-based pacing from before;
   dwell time is shared out of a fixed budget so a trip with sixty stops doesn't
   run for two minutes. */
function buildTimeline(stops) {
  // Decide which stops get a photo before working out how long each one lasts.
  const featured = new Set();
  if (stops.length <= MAX_PHOTO_STOPS) {
    stops.forEach(s => featured.add(s));
  } else {
    stops.slice()
      .sort((a, b) => b.photos.length - a.photos.length || a.when - b.when)
      .slice(0, MAX_PHOTO_STOPS)
      .forEach(s => featured.add(s));
  }

  const shown = Math.min(stops.length, MAX_PHOTO_STOPS) || 1;
  const dwell = Math.min(DWELL_MAX_MS, Math.max(DWELL_MIN_MS, DWELL_BUDGET_MS / shown));

  /* Stops without a photo still get a beat so the dot visibly arrives, but that
     beat has to come out of a fixed budget too. At a fifth of a second each,
     two thousand of them added seven minutes to the replay on their own. */
  const passing = Math.max(0, stops.length - shown);
  const beat = passing ? Math.min(200, PASSTHROUGH_BUDGET_MS / passing) : 0;

  const { pts, stopAt } = smoothRoute(stops);
  const cum = cumulativeLengths(pts);

  // Pace by the length of the curve actually travelled, not the straight line.
  const weights = [];
  let weightTotal = 0;
  for (let i = 1; i < stops.length; i++) {
    const w = segWeight(cum[stopAt[i]] - cum[stopAt[i-1]]);
    weights.push(w);
    weightTotal += w;
  }

  const items = [];
  let at = 0;
  stops.forEach((stop, i) => {
    if (i > 0) {
      const dur = weightTotal ? (weights[i-1] / weightTotal) * PLAY_TOTAL_MS : 0;
      items.push({
        type: 'travel', from: stops[i-1], to: stop, start: at, dur,
        fromIdx: stopAt[i-1], toIdx: stopAt[i],
        d0: cum[stopAt[i-1]], d1: cum[stopAt[i]]
      });
      at += dur;
    }
    // A stop with no preview, or one not selected on a long trip, still gets a
    // short beat so the dot visibly arrives rather than sailing straight past.
    const hasPhoto = featured.has(stop) && stop.rep && stop.rep.thumb;
    const d = hasPhoto ? dwell : beat;
    items.push({ type: 'dwell', stop, index: i, start: at, dur: d, hasPhoto });
    at += d;
  });

  return { items, total: at, pts, cum, stopAt };
}

function startPlayback(trip) {
  stopPlayback();
  if (trip.photos.length < 2) { zoomTo(trip.photos); return; }

  // A trip whose photos were all taken in one spot collapses to a single stop.
  // That still plays — you get the photo — rather than silently doing nothing.
  const stops = buildStops(trip.photos);
  if (!stops.length) return;
  const timeline = buildTimeline(stops);
  console.log(`playback: ${trip.photos.length} photos, ${stops.length} stops, ` +
              `${(timeline.total / 1000).toFixed(1)}s`);

  /* Everything for the replay goes onto one canvas.

     The dot used to be an L.marker, and Leaflet positions marker icons by
     rounding to whole pixels. Moving slower than a pixel per frame means the
     transform snaps between two integers over and over, which is the vibration.
     A canvas layer draws at floating-point coordinates, so slow movement is
     genuinely smooth.

     The path is split in two as well. Rebuilding the entire polyline every frame
     meant regenerating a path of hundreds of points sixty times a second; now
     the finished part is only rewritten when a segment is crossed, and the part
     still being drawn is a two-point line. */
  const canvas = L.canvas({ padding: 0.5 }).addTo(map);

  const doneLine = L.polyline([[stops[0].lat, stops[0].lon]], {
    color: trip.color, weight: 4, opacity: .95,
    lineJoin: 'round', lineCap: 'round', smoothFactor: 1, renderer: canvas
  }).addTo(map);

  const liveLine = L.polyline([], {
    color: trip.color, weight: 4, opacity: .95,
    lineJoin: 'round', lineCap: 'round', renderer: canvas
  }).addTo(map);

  const head = L.circleMarker([stops[0].lat, stops[0].lon], {
    radius: 6, color: '#fff', weight: 2.5,
    fillColor: trip.color, fillOpacity: 1, renderer: canvas
  }).addTo(map);

  // The pins and static routes would only clutter the replay.
  if (cluster) map.removeLayer(cluster);
  layers.forEach(l => { if (l instanceof L.Polyline) map.removeLayer(l); });

  playback = {
    trip, stops, items: timeline.items,
    pts: timeline.pts, cum: timeline.cum, stopAt: timeline.stopAt,
    canvas, doneLine, liveLine, head,
    t: 0, speed: 1, paused: false, last: performance.now(),
    lastPan: 0, shownIndex: -1, doneUpto: -1, photoUp: false,
    total: timeline.total
  };

  document.body.classList.add('playing');
  playbar.classList.add('on');
  playPauseB.textContent = 'Pause';
  playSpeedB.textContent = '1×';
  closeSheet();

  map.fitBounds(L.latLngBounds(stops.map(s => [s.lat, s.lon])),
    { padding: [70, 70], maxZoom: 15 });

  // Tapping the map is the other obvious way to say "I'm done watching".
  // Registered a tick late so the tap that started playback can't also end it.
  setTimeout(() => { if (playback) map.once('click', stopPlayback); }, 0);

  playback.raf = requestAnimationFrame(playFrame);
}

function playFrame(now) {
  const pb = playback;
  if (!pb) return;

  const dt = Math.min(64, now - pb.last);   // clamp, so a background tab
  pb.last = now;                            // doesn't jump the whole route
  if (!pb.paused) pb.t = Math.min(pb.total, pb.t + dt * pb.speed);

  // Which item of the timeline are we in, and how far through it?
  let i = pb.items.length - 1;
  while (i > 0 && pb.t < pb.items[i].start) i--;
  const item = pb.items[i];
  const f = item.dur ? Math.min(1, Math.max(0, (pb.t - item.start) / item.dur)) : 1;

  let lat, lon, stopIndex, curveIdx;
  if (item.type === 'travel') {
    // Distance along the curve, so the pace stays even through the bends.
    const here = pointAtDistance(pb.pts, pb.cum, item.d0 + (item.d1 - item.d0) * f);
    lat = here[0]; lon = here[1];
    curveIdx = item.fromIdx;
    stopIndex = pb.stops.indexOf(f > 0.5 ? item.to : item.from);
    showPlayPhoto(null);
  } else {
    lat = item.stop.lat;
    lon = item.stop.lon;
    curveIdx = pb.stopAt[item.index];
    stopIndex = item.index;
    showPlayPhoto(item.hasPhoto ? item.stop : null);
  }

  // The finished part of the curve only changes when a stop is passed.
  if (curveIdx !== pb.doneUpto) {
    pb.doneUpto = curveIdx;
    pb.doneLine.setLatLngs(pb.pts.slice(0, curveIdx + 1));
  }
  // The part currently being drawn is the curve so far within this leg.
  if (item.type === 'travel') {
    const upto = [];
    for (let k = item.fromIdx; k <= item.toIdx && pb.cum[k] <= item.d0 + (item.d1 - item.d0) * f; k++) {
      upto.push(pb.pts[k]);
    }
    upto.push([lat, lon]);
    pb.liveLine.setLatLngs(upto);
  } else {
    pb.liveLine.setLatLngs([]);
  }
  pb.head.setLatLng([lat, lon]);

  /* Keep the head on screen without recentering every frame. Only nudge when it
     leaves the middle of the viewport, never while a previous pan is still
     running — overlapping pan tweens were a second source of judder, since each
     one restarts the easing from a moving position. */
  const size = map.getSize();
  const pt = map.latLngToContainerPoint([lat, lon]);
  const outside = pt.x < size.x * 0.2 || pt.x > size.x * 0.8 ||
                  pt.y < size.y * 0.2 || pt.y > size.y * 0.8;
  const panning = map._panAnim && map._panAnim._inProgress;
  if (outside && !panning && now - pb.lastPan > 1100) {
    pb.lastPan = now;
    map.panTo([lat, lon], { animate: true, duration: 0.7, easeLinearity: 0.4 });
  }

  if (stopIndex !== pb.shownIndex && stopIndex >= 0) {
    pb.shownIndex = stopIndex;
    const stop = pb.stops[stopIndex];
    const dayNo = new Set(pb.stops.slice(0, stopIndex + 1).map(s => dayKey(s.when))).size;
    const shots = stop.photos.length;
    playPlace.textContent = nearestCity(stop.lat, stop.lon);
    playSub.textContent =
      `${longDay(stop.when)} · ${clock(stop.when)} — day ${dayNo} of ${pb.trip.days.length}` +
      ` · stop ${stopIndex + 1} of ${pb.stops.length}` +
      (shots > 1 ? ` · ${shots} photos here` : '');
    const url = stop.rep && thumbUrl(stop.rep);
    playThumb.hidden = !url;
    if (url) playThumb.src = url;
  }

  playFill.style.width = (pb.t / pb.total * 100).toFixed(1) + '%';

  if (pb.t >= pb.total) { finishPlayback(); return; }
  pb.raf = requestAnimationFrame(playFrame);
}

/* When the route finishes, hold the completed line on screen for a moment and
   then clear away. Leaving the bar up was worse than useless on a phone — it
   parks itself over the navigation and there's no obvious reason it's still
   there. Replaying is one tap on the trip's own Play button. */
function finishPlayback() {
  if (!playback) return;
  playback.paused = true;
  playback.finished = true;
  playPauseB.textContent = 'Replay';
  playSub.textContent = 'Trip complete';

  playback.dismiss = setTimeout(() => {
    // Only if the user hasn't picked it back up in the meantime.
    if (playback && playback.finished) stopPlayback();
  }, 2600);
}

function stopPlayback() {
  if (!playback) return;
  cancelAnimationFrame(playback.raf);
  clearTimeout(playback.dismiss);
  map.off('click', stopPlayback);
  playPhoto.classList.remove('on');
  [playback.doneLine, playback.liveLine, playback.head, playback.canvas]
    .forEach(l => { if (l) map.removeLayer(l); });
  playback = null;
  document.body.classList.remove('playing');
  playbar.classList.remove('on');
  build();          // puts the pins and static routes back
}

playPauseB.addEventListener('click', () => {
  if (!playback) return;
  if (playback.t >= playback.total) {       // finished — start again
    clearTimeout(playback.dismiss);         // cancel the auto-dismiss
    playback.finished = false;
    playback.t = 0;
    playback.shownIndex = -1;
    playback.paused = false;
    playback.last = performance.now();
    playPauseB.textContent = 'Pause';
    playback.raf = requestAnimationFrame(playFrame);
    return;
  }
  playback.paused = !playback.paused;
  playPauseB.textContent = playback.paused ? 'Play' : 'Pause';
  playPhoto.classList.toggle('held', playback.paused);   // keep the two in step
});

playSpeedB.addEventListener('click', () => {
  if (!playback) return;
  const next = SPEEDS[(SPEEDS.indexOf(playback.speed) + 1) % SPEEDS.length];
  playback.speed = next;
  playSpeedB.textContent = next + '×';
});

document.getElementById('playStop').addEventListener('click', stopPlayback);

document.getElementById('playTrack').addEventListener('click', e => {
  if (!playback) return;
  clearTimeout(playback.dismiss);
  playback.finished = false;
  const r = e.currentTarget.getBoundingClientRect();
  playback.t = Math.min(playback.total, Math.max(0, (e.clientX - r.left) / r.width * playback.total));
  playback.shownIndex = -1;
  if (playback.t < playback.total && playPauseB.textContent === 'Replay') {
    playPauseB.textContent = playback.paused ? 'Play' : 'Pause';
  }
});

document.addEventListener('keydown', e => {
  if (!playback) return;
  if (e.key === 'Escape') stopPlayback();
  if (e.key === ' ') { e.preventDefault(); playPauseB.click(); }
});

function zoomTo(ps) {
  if (!ps.length) return;
  map.fitBounds(L.latLngBounds(ps.map(p => [p.lat, p.lon])),
    { padding: [55, 55], maxZoom: 16, animate: true });
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- start ----------
   Restore whatever is already stored before showing the drop zone, so opening
   the page lands you on your map rather than an empty prompt. */

(async function start() {
  importBt.hidden = false;
  try {
    const recs = await loadLibrary();
    if (recs.length) {
      intro.classList.add('hidden');
      await rebuildFromLibrary();
    }
    // After the rebuild, or build() would overwrite the message.
    reportLastCrash();
  } catch (err) {
    console.warn('could not restore library:', err);
  }
})();

/* Register the service worker so the app opens offline once it has been
   visited. Requires a secure context — opening index.html straight off disk
   won't register one, which is expected and harmless. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => console.warn('service worker not registered:', err));
  });
}
</script>
