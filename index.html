<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Map</title>
<meta name="description" content="Plots your travel routes from the GPS coordinates in your own photos. Everything stays on your device.">

<!-- Installable web app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141a28">
<link rel="icon" href="icon-192.png" sizes="192x192">
<!-- iOS ignores the manifest's icons and reads this instead -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Map">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #e3e6ea;
    --panel: #f7f8fa;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaed; --muted: #9aa1ab;
      --line: #2a2e35; --panel: #1a1d22; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--fg); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none;
    /* Launched from the home screen there is no browser chrome, so the header
       sits under the status bar and notch unless it accounts for them. */
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
  }
  #side { padding-bottom: env(safe-area-inset-bottom, 0px); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .stats { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.danger:hover { border-color: #dc2626; color: #dc2626; }
  header .stats b { font-weight: 600; color: var(--fg); }

  /* Positioned so the play bar and photo card are placed against the map area
     rather than the whole viewport. Without this they escape to the initial
     containing block on desktop and can overlap the sidebar. */
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #side {
    width: 320px; flex: none; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel);
  }
  #map { flex: 1; min-width: 0; background: var(--panel); }

  /* ---- drop zone ---- */
  #intro {
    position: absolute; inset: 0; z-index: 1200;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); padding: 24px;
  }
  #intro.hidden { display: none; }
  /* No dashed rectangle. It's a file-upload cliché, it means nothing on a phone
     where you tap rather than drop, and it made the first screen look like a
     form. The whole panel is still a drop target — it just says so by
     responding when you drag onto it, rather than by drawing a box. */
  #drop {
    border: 1px solid transparent; border-radius: 16px; padding: 40px 32px;
    text-align: center; cursor: pointer; max-width: 460px;
    transition: background .18s, border-color .18s;
  }
  #drop.hot { border-color: var(--accent); background: var(--panel); }
  #drop h2 { margin: 0 0 10px; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
  #drop p { margin: 0; color: var(--muted); font-size: 13.5px; }
  #drop .note {
    margin-top: 22px; font-size: 12px; color: var(--muted); opacity: .8;
    max-width: 340px; margin-inline: auto; line-height: 1.6;
  }

  /* ---- sidebar ---- */
  .trip { border-bottom: 1px solid var(--line); }
  .trip-head {
    display: flex; align-items: center; gap: 9px; padding: 11px 14px;
    cursor: pointer; user-select: none;
  }
  .trip-head:hover { background: rgba(127,127,127,.07); }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .trip-title { font-weight: 600; flex: 1; min-width: 0; }
  .trip-title small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .caret { color: var(--muted); font-size: 11px; transition: transform .15s; }
  .trip.open .caret { transform: rotate(90deg); }
  .trip-body { display: none; padding: 0 0 8px; }
  .trip.open .trip-body { display: block; }

  .day { margin: 0 10px 6px; }
  .day-head {
    font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 5px 6px; cursor: pointer; border-radius: 5px;
    display: flex; justify-content: space-between;
  }
  .day-head:hover { background: rgba(127,127,127,.1); color: var(--fg); }
  .shot {
    display: flex; gap: 8px; align-items: baseline;
    padding: 4px 10px; margin-left: 6px; font-size: 12.5px;
    cursor: pointer; border-radius: 5px; border-left: 2px solid var(--line);
  }
  .shot:hover { background: rgba(127,127,127,.1); border-left-color: var(--accent); }
  .shot .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .shot .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .shot { align-items: center; }
  .thumb {
    width: 34px; height: 34px; flex: none; border-radius: 4px;
    object-fit: cover; background: rgba(127,127,127,.18);
  }
  .thumb.empty { background: rgba(127,127,127,.12); }

  /* ---- full-screen photo ----
     A grid, not a centered flex column. The image gets one row that is whatever
     height is left over and centers itself inside it; the caption gets its own
     row at the bottom. Previously the image and the caption fought for space in
     the same flex flow, so the photo ended up small and sitting off-center. */
  #viewer {
    position: fixed; inset: 0; z-index: 2000; display: none;
    background: #0a0c10;
    grid-template-rows: 1fr auto;
  }
  #viewer.open { display: grid; }
  #viewerBody {
    min-height: 0; display: grid; place-items: center;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 10px 10px;
  }
  #viewer img {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto; object-fit: contain;
    border-radius: 4px; display: block;
  }
  #viewer .meta {
    color: #e8eaed; text-align: center; font-size: 13px; line-height: 1.55;
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid rgba(255,255,255,.08);
  }
  #viewer .meta b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  #viewer .meta span { color: #9aa1ab; }
  #viewer .meta .hint { display: block; color: #5d646f; font-size: 11.5px; margin-top: 6px; }
  #viewer .close {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px;
    z-index: 2; background: rgba(255,255,255,.12); border-color: transparent;
    color: #fff; backdrop-filter: blur(8px);
  }
  #viewer .none {
    color: #6b7280; border: 1px solid #262b34; border-radius: 12px;
    padding: 52px 34px; font-size: 13px;
  }

  #unplaced .trip-head { cursor: default; }
  #unplaced .trip-head:hover { background: none; }
  .up-item { padding: 3px 14px 3px 33px; font-size: 12.5px; color: var(--muted); }

  /* A plain dot. The sequence number was only readable at high zoom and turned
     dense areas into a wall of digits — it lives in the popup now. */
  .marker-dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.92);
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .cluster {
    color: #fff; border: 2px solid rgba(255,255,255,.92); border-radius: 50%;
    text-align: center; font-weight: 600; font-variant-numeric: tabular-nums;
    background: #46536b; box-shadow: 0 1px 5px rgba(0,0,0,.3);
  }
  .marker-cluster { background: none; }   /* drop the plugin's default styling */
  .leaflet-popup-content { margin: 10px 12px; font: 13px/1.45 ui-sans-serif, sans-serif; }
  .leaflet-popup-content b { display: block; margin-bottom: 3px; }
  .leaflet-popup-content span { color: #666; font-size: 12px; }
  .popup-thumb {
    display: block; max-width: 190px; max-height: 190px; border-radius: 5px;
    margin-bottom: 7px; cursor: zoom-in;
  }

  .empty { padding: 30px 16px; color: var(--muted); text-align: center; font-size: 13px; }

  /* ---- route playback ---- */
  .play-trip {
    margin-left: auto; flex: none; font-size: 11px; padding: 4px 9px;
    border-radius: 5px; border: 1px solid var(--line);
    background: var(--bg); color: var(--muted); cursor: pointer;
  }
  .play-trip:hover { color: var(--fg); border-color: var(--muted); }

  /* Hidden by visibility, not by sliding it out of frame. A percentage
     translate moves the bar by a multiple of its own height, which cleared the
     screen at 18px from the bottom but not once it was raised above the mobile
     nav — so it sat there permanently, covering the buttons. Visibility doesn't
     care where the bar is or how tall it grew. */
  #playbar {
    position: absolute; left: 50%; bottom: 18px; z-index: 1100;
    width: min(460px, calc(100% - 28px));
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 30px rgba(0,0,0,.22); padding: 12px 14px;
    visibility: hidden; opacity: 0; pointer-events: none;
    transform: translateX(-50%) translateY(16px);
    transition: opacity .2s, transform .28s cubic-bezier(.32,.72,0,1), visibility 0s .2s;
  }
  #playbar.on {
    visibility: visible; opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
    transition: opacity .2s, transform .28s cubic-bezier(.32,.72,0,1), visibility 0s;
  }
  #playbar .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #playbar .caption { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; }
  #playbar .caption small {
    display: block; font-weight: 400; color: var(--muted); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #playbar button { flex: none; padding: 6px 10px; font-size: 12px; }
  #playbar .track {
    height: 4px; border-radius: 2px; background: var(--line);
    overflow: hidden; cursor: pointer;
  }
  #playbar .fill { height: 100%; width: 0; background: var(--accent); transition: width .1s linear; }

  /* The photo shown while the dot is parked at a stop.

     Centered, and large. It was originally offset upwards to avoid covering the
     dot, which only made it look misplaced — and the dot is stationary during a
     dwell anyway, so there is nothing to avoid. The photo is the point of the
     pause; it should take the screen and then get out of the way. */
  /* Given a real width and height, not just maximums.

     With only max-width/max-height an absolutely positioned box shrinks to fit
     its content, so the card ended up the size of the stored preview — and a
     library imported before previews grew is full of 200px images. The card
     rendered at 200px however much room it had. Fixed dimensions plus
     object-fit: contain means the photo fills the space it is given. */
  /* The card takes the shape of the photo inside it.

     A fixed box meant a portrait photo sat in a landscape frame with black bars
     down either side. Instead the aspect ratio is set from the image itself once
     it loads, and the box is sized by width with height derived from that ratio
     — clamped by max-height, which the browser honors by narrowing the width to
     match. So a tall photo comes out tall, a wide one wide, and there is never
     any leftover background to see. */
  #playphoto {
    position: absolute; z-index: 1050;
    /* Only catches taps while it is actually visible. Left at 'auto' it stayed
       in the DOM at zero opacity, above the trip sheet, silently swallowing
       every tap that landed on it — including the Play button underneath. */
    pointer-events: none; cursor: pointer;
    left: 50%; top: 50%;
    width: min(74%, 620px);
    aspect-ratio: var(--ar, 3 / 4);
    max-height: 66%;
    height: auto;
    transform: translate(-50%, -50%) scale(.96);
    opacity: 0; transition: opacity .26s ease, transform .32s cubic-bezier(.32,.72,0,1);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 16px 54px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.96);
  }
  #playphoto.on {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;   /* tap to hold, only while showing */
  }
  #playphoto.held { box-shadow: 0 16px 54px rgba(0,0,0,.55), 0 0 0 4px var(--accent); }
  #playphoto .held-tag {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-size: 11.5px; font-weight: 600;
    padding: 4px 11px; border-radius: 20px; opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap;
  }
  #playphoto.held .held-tag { opacity: 1; }
  #playphoto img {
    display: block; width: 100%; height: 100%;
    object-fit: cover;   /* the box already matches the photo, so nothing crops */
  }

  @media (max-width: 720px) {
    #playphoto { width: 92%; max-height: 62%; }
  }

  /* The moving head of the animated route. */
  .route-head {
    width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.4);
  }
  /* During playback the navigation goes away completely rather than sitting
     dimmed. A greyed-out bar still takes up the bottom of the screen and pushes
     the play controls into an odd position above it. */
  body.playing #side, body.playing #mobilebar {
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }

  .picks { display: flex; gap: 8px; justify-content: center; margin: 18px 0 0; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 13px; padding: 9px 16px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    cursor: pointer; display: inline-block; user-select: none;
  }
  .btn:hover { border-color: var(--muted); }
  /* Hidden from view but still a real, tappable input — display:none would stop
     the label from activating it on some browsers. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Phone chrome — hidden on desktop, where the header and sidebar work fine. */
  #mobilebar, #mMenu, #sheetTop { display: none; }

  /* ---- narrow screens ----
     The map takes the whole screen and the trip list becomes a sheet that
     slides up over it. Controls live along the bottom edge, because the top
     of an iPhone screen is claimed by iOS gestures. */
  @media (max-width: 720px) {
    header { display: none; }

    main { position: relative; }
    #map {
      position: absolute; inset: 0; height: auto; flex: none;
      z-index: 1;
    }

    /* The trip list as a bottom sheet, overlaying the map rather than shrinking
       it — so the map never has to be told its size changed. */
    #side {
      position: absolute; left: 0; right: 0; bottom: 0; top: auto;
      width: auto; height: 62vh; z-index: 900;
      border-right: none; border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 28px rgba(0,0,0,.28);
      transform: translateY(101%);
      transition: transform .26s cubic-bezier(.32,.72,0,1);
      padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    }
    body.sheet-open #side { transform: translateY(0); }

    #sheetTop {
      display: block; position: sticky; top: 0; z-index: 2;
      background: var(--panel); padding: 10px 14px 10px;
      border-bottom: 1px solid var(--line);
      /* The handle is a drag surface, so the browser must not claim the gesture
         for scrolling, and a long press shouldn't select the text under it. */
      touch-action: none; user-select: none; cursor: grab;
    }
    #sheetTop:active { cursor: grabbing; }
    #sheetTop .grip {
      width: 38px; height: 4px; border-radius: 2px; margin: 0 auto 8px;
      background: var(--line);
    }
    #sheetTop .s { color: var(--muted); font-size: 12px; text-align: center; display: block; }

    #mobilebar {
      display: flex; gap: 8px; align-items: center; justify-content: center;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);   /* fallback for browsers without color-mix */
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
    #mobilebar > * { flex: 1; text-align: center; padding: 11px 8px; font-size: 13px; }
    #mobilebar #mMore { flex: 0 0 52px; letter-spacing: 1px; }
    body.sheet-open #mTrips { background: var(--accent); color: #fff; border-color: var(--accent); }

    #mMenu {
      display: none; position: fixed; z-index: 1001;
      right: 12px; bottom: calc(66px + env(safe-area-inset-bottom, 0px));
      flex-direction: column; gap: 6px; padding: 8px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 6px 28px rgba(0,0,0,.3);
    }
    #mMenu.open { display: flex; }
    #mMenu button { text-align: left; padding: 10px 14px; }

    /* Clear of the bottom navigation normally; down to the edge while playing,
       since the navigation is hidden then and the gap looks like a mistake. */
    #playbar { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
    body.playing #playbar { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }

    #intro { z-index: 1200; }
    #drop { padding: 32px 20px; }
    #drop h2 { font-size: 17px; }
    .picks .btn { flex: 1; min-width: 140px; }

    /* Leaflet puts its zoom buttons top-left, right where iOS wants the status
       bar. Pinch works; the buttons don't need to be there. */
    .leaflet-control-zoom { display: none; }
    .leaflet-control-attribution { font-size: 9px; }
  }
</style>
</head>
<body>

<header>
  <h1>Trip Map</h1>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <button id="reset" hidden>Add photos</button>
  <button id="export" hidden>Export</button>
  <button id="importBtn" hidden>Import</button>
  <button id="clear" hidden class="danger">Clear</button>
  <input type="file" id="jsonPicker" accept="application/json,.json" hidden>
</header>

<main>
  <div id="side">
    <div id="sheetTop"><div class="grip"></div><span class="s" id="sheetStats"></span></div>
    <div id="sideBody"><div class="empty">No photos loaded.</div></div>
  </div>
  <div id="map"></div>
  <div id="playphoto"><img alt=""><span class="held-tag">Holding — tap to continue</span></div>
  <div id="playbar">
    <div class="row1">
      <button id="playPause">Pause</button>
      <img id="playThumb" class="thumb" alt="" hidden>
      <span class="caption"><span id="playPlace">—</span><small id="playSub"></small></span>
      <button id="playSpeed">1×</button>
      <button id="playStop">Stop</button>
    </div>
    <div class="track" id="playTrack"><div class="fill" id="playFill"></div></div>
  </div>
</main>

<div id="viewer">
  <button class="close" id="viewerClose">Close</button>
  <div id="viewerBody"></div>
  <div class="meta" id="viewerMeta"></div>
</div>

<div id="intro">
  <div id="drop">
    <h2>Drag a folder of photos here</h2>
    <p>Reads GPS and timestamps, plots your route, groups it by day.</p>
    <!-- Labels, not buttons. iOS shows its Photos / Camera / Files chooser only
         when the tap reaches the file input itself; a hidden input triggered by
         .click() from script lands straight in the Files browser instead. -->
    <div class="picks">
      <label class="btn" for="picker">Choose a folder</label>
      <label class="btn" for="photoPicker">Choose photos</label>
    </div>
    <!-- inputs live outside this panel, at the end of the document -->
    <p class="note">
      Photos are added to your existing library, never replacing it. Everything
      runs in this tab — no upload, no server, nothing leaves your machine.
    </p>
    <!-- Two inputs on purpose. Folder selection needs webkitdirectory, which iOS
         doesn't support — on a phone that input can come back empty, so there has
         to be a plain multi-file picker as well. -->
  </div>
</div>

<!-- Kept at document level, not inside the intro panel. A label can only
     activate an input that is actually rendered, and the intro panel gets
     display:none once photos are loaded — which would break "Add photos". -->
<input type="file" id="picker" class="sr-only" webkitdirectory directory multiple>
<input type="file" id="photoPicker" class="sr-only" accept="image/*" multiple>

<!-- Phone controls. These sit along the bottom edge because the top of an
     iPhone screen belongs to iOS: reaching for a control up there pulls down
     the status bar instead. -->
<div id="mobilebar">
  <button id="mTrips" aria-expanded="false">Trips</button>
  <label class="btn" for="photoPicker">Add photos</label>
  <button id="mMore" aria-label="More options">•••</button>
</div>
<div id="mMenu">
  <button id="mExport">Export library</button>
  <button id="mImport">Import library</button>
  <button id="mClear" class="danger">Clear library</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="cities.js"></script>
<script>
/* ============================================================
   Trip Map — client-side EXIF → map + timeline
   Splits a mixed photo library into separate trips using
   time gaps and geographic jumps.
   ============================================================ */

const IMAGE_RE  = /\.(hei[cf]|jpe?g|png|tiff?|dng|webp|avif)$/i;
// Distance is the reliable signal for "this is a different trip"; time alone is
// not. A 20h overnight gap in one city is just sleep, so time only splits a trip
// after a gap long enough that you were plainly doing something else.
const GAP_HOURS = 48;    // silence this long => treat as a separate trip
const JUMP_KM   = 300;   // moved this far => separate trip regardless of time

const PALETTE = ['#2563eb','#dc2626','#059669','#d97706','#7c3aed',
                 '#0891b2','#db2777','#65a30d','#ea580c','#4f46e5'];

// Place names come from cities.js — 49,025 settlements of 5,000 people or more,
// loaded as one newline-delimited string and indexed by whole degree of latitude
// on first use. Scanning all 49k entries per lookup would work, but bucketing
// means a lookup only compares against the handful of cities in neighbouring
// latitude bands.
const MATCH_RADIUS_KM = 30;

let cityIndex = null;

function buildCityIndex() {
  const index = new Map();
  if (typeof window.CITY_DATA !== 'string') return index;   // cities.js absent
  for (const line of window.CITY_DATA.split('\n')) {
    const a = line.indexOf('|');
    const b = line.indexOf('|', a + 1);
    if (a < 0 || b < 0) continue;
    const lat = +line.slice(0, a), lon = +line.slice(a + 1, b);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    const key = Math.floor(lat);
    let bucket = index.get(key);
    if (!bucket) index.set(key, bucket = []);
    bucket.push([lat, lon, line.slice(b + 1)]);
  }
  return index;
}

/* ---------- geo helpers ---------- */

function haversineKm(a, b, c, d) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (c - a) * rad, dLon = (d - b) * rad;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(a*rad) * Math.cos(c*rad) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function nearestCity(lat, lon) {
  if (!cityIndex) cityIndex = buildCityIndex();

  let best = null, bestD = Infinity;
  const key = Math.floor(lat);
  // A degree of latitude is ~111 km, so the 30 km radius can only ever reach
  // into the neighbouring bands.
  for (let k = key - 1; k <= key + 1; k++) {
    const bucket = cityIndex.get(k);
    if (!bucket) continue;
    for (const [cLat, cLon, name] of bucket) {
      const d = haversineKm(lat, lon, cLat, cLon);
      if (d < bestD) { bestD = d; best = name; }
    }
  }
  // Naming somewhere 100 km away is worse than saying nothing — falling back to
  // coordinates is honest, whereas calling Girona "Barcelona" is just wrong.
  return bestD <= MATCH_RADIUS_KM ? best : `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
}

/* ---------- date helpers ---------- */

const pad = n => String(n).padStart(2, '0');
const dayKey  = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const clock   = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const longDay = d => d.toLocaleDateString(undefined,
  { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

function rangeLabel(a, b) {
  const o = { month: 'short', day: 'numeric' };
  const sameYear = a.getFullYear() === b.getFullYear();
  const s = a.toLocaleDateString(undefined, o);
  const e = b.toLocaleDateString(undefined, o);
  const yr = sameYear ? ` ${a.getFullYear()}` : '';
  return (s === e ? s : `${s} – ${e}`) + yr;
}

/* ---------- crash breadcrumbs ----------
   A phone browser that runs out of memory kills the tab and reloads the page.
   From the outside that is indistinguishable from "I tapped the button and
   nothing happened", which makes the failure impossible to diagnose. So each
   stage of an import writes a marker to localStorage and clears it on success.
   Anything left behind on the next load is the record of a crash, and says
   exactly how far it got. */

const CRUMB = 'tripmap.import';
const crumb = (stage, extra = {}) => {
  try { localStorage.setItem(CRUMB, JSON.stringify({ stage, at: Date.now(), ...extra })); }
  catch (_) {}
};
const clearCrumb = () => { try { localStorage.removeItem(CRUMB); } catch (_) {} };

function reportLastCrash() {
  let c = null;
  try { c = JSON.parse(localStorage.getItem(CRUMB) || 'null'); } catch (_) {}
  if (!c) return;
  clearCrumb();

  const msg = c.stage === 'received'
    ? `Last time, the picker handed over ${c.count} photos but the tab was killed before reading any. `
    + `That is a memory limit — try 20–30 at a time.`
    : c.stage === 'reading'
    ? `Last time, reading stopped at photo ${c.done} of ${c.count}. The tab ran out of memory. `
    + `Anything already saved is on the map; try a smaller batch for the rest.`
    : `Last import stopped during "${c.stage}".`;

  statsEl.textContent = msg;
  console.warn('previous import did not finish:', c);
}

async function handlePicked(e) {

  // Nothing came back at all — the picker itself failed, before any of our code.
  if (!files.length) {
    statsEl.textContent = 'The picker returned no photos. If you selected some, '
      + 'iOS may still be downloading them from iCloud — try again on Wi-Fi, or in smaller batches.';
    return;
  }

  crumb('received', { count: files.length });
  drop.querySelector('h2').textContent = `Received ${files.length} photos…`;

  busy = true;
  skipped = 0;
  try { await ingest(files); } finally { busy = false; }
}

drop.addEventListener('drop', async e => {
  e.preventDefault();
  if (busy) return;

  // webkitGetAsEntry must be called synchronously — the moment this handler
  // awaits anything, the browser clears dataTransfer and the items are gone.
  const entries = [...e.dataTransfer.items]
    .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const loose = [...e.dataTransfer.files];

  busy = true;
  skipped = 0;
  const h2 = drop.querySelector('h2');
  try {
    let files;
    if (entries.length) {
      h2.textContent = 'Reading folder…';
      const found = [];

      h2.textContent = `Opening ${found.length} photos…`;

      files = loose;
